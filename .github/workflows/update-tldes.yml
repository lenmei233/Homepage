name: Update tldes data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest tldes prices
        run: node scripts/fetch-tldes.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tldes-prices.json
          if git diff --cached --quiet; then
            echo "No changes to price data"
          else
            git commit -m "chore: update tldes price data"
            git push
          fi
